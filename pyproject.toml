[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "distributed-job-scheduler"
version = "0.1.0"
description = "A PostgreSQL-backed priority queue with leased workers and a FastAPI API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "uvicorn==0.54.0",
  "psycopg[binary]==3.3.6",
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.setuptools.packages.find]
include = ["scheduler*"]

[tool.setuptools.package-data]
scheduler = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

